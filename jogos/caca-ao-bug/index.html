<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caça ao bug — Portal Pixel</title>
<meta name="description" content="Jogo para iniciantes em lógica de programação: encontre o erro em pequenos programas, corrija e veja o resultado.">
<style>
  :root { --bg:#f4f1ea; --card:#ffffff; --ink:#23211d; --muted:#6b665c; --acc:#2f7d6d; --acc-2:#e0a526; --erro:#b5382b; --ok:#2e7d4f; --borda:#d8d2c4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 18px; background:var(--card); border-bottom:1px solid var(--borda); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:1.2rem; margin:0; }
  header a { color:var(--acc); text-decoration:none; font-weight:600; }
  .layout { display:grid; grid-template-columns: 230px 1fr; gap:16px; padding:16px; max-width:1100px; margin:0 auto; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:16px; }
  aside.fases { display:flex; flex-direction:column; gap:4px; max-height:85vh; overflow:auto; }
  .grupo { font-size:.75rem; color:var(--muted); font-weight:700; text-transform:uppercase; margin:10px 0 2px; }
  .fase-btn { text-align:left; background:#fff; border:1px solid var(--borda); border-radius:8px; padding:7px 9px; cursor:pointer; font:inherit; color:var(--ink); }
  .fase-btn.atual { border-color:var(--acc); background:#eef6f3; }
  .fase-btn .estrelas { float:right; color:var(--acc-2); letter-spacing:1px; }
  .progresso { font-size:.85rem; color:var(--muted); margin-top:8px; }
  h2 { margin:0 0 4px; font-size:1.2rem; }
  .objetivo { margin:0 0 12px; color:var(--muted); }
  .painel-cod { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width:760px) { .painel-cod { grid-template-columns:1fr; } }
  .rotulo { font-size:.75rem; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:6px; }
  ol.codigo { list-style:none; margin:0; padding:0; background:#faf8f2; border:1px solid var(--borda); border-radius:8px; font-family: Consolas, "Courier New", monospace; font-size:.95rem; }
  ol.codigo li button { display:block; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid #eee7d6; padding:8px 10px; font:inherit; font-family:inherit; color:var(--ink); cursor:pointer; }
  ol.codigo li:last-child button { border-bottom:0; }
  ol.codigo li button:hover { background:#f1ece0; }
  ol.codigo li button:disabled { cursor:default; }
  ol.codigo li button .num { display:inline-block; width:28px; color:var(--muted); }
  ol.codigo li.errada button { background:#fbe7e4; }
  ol.codigo li.certa button { background:#e4f5ea; }
  .saida { font-family: Consolas, "Courier New", monospace; background:#23211d; color:#f5f1e6; border-radius:8px; padding:10px; min-height:44px; white-space:pre-wrap; }
  .passo { margin:14px 0 8px; font-weight:700; }
  .opcoes { display:flex; flex-direction:column; gap:8px; }
  .opcao { text-align:left; background:#fff; border:1px solid var(--borda); border-radius:8px; padding:9px 12px; font-family: Consolas, "Courier New", monospace; font-size:.95rem; cursor:pointer; }
  .opcao:hover { border-color:var(--acc); }
  .opcao:disabled { cursor:default; }
  .opcao.certa { border-color:var(--ok); background:#e4f5ea; }
  .opcao.errada { border-color:var(--erro); background:#fbe7e4; }
  .resultado { font-size:.9rem; color:var(--muted); margin-left:6px; }
  .msg { padding:10px; border-radius:8px; min-height:44px; font-size:.95rem; margin-top:12px; }
  .msg.ok { background:#e4f5ea; color:var(--ok); }
  .msg.erro { background:#fbe7e4; color:var(--erro); }
  .msg.info { background:#fdf3d8; color:#6a4b00; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  button { font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .primario { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-weight:700; }
  .sec { background:#fff; color:var(--ink); border:1px solid var(--borda); border-radius:8px; padding:8px 12px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Caça ao bug</h1>
  <a href="../../index.html">← Portal Pixel</a>
</header>

<div class="layout">
  <aside class="card fases" id="fases" aria-label="Fases"></aside>

  <main class="card">
    <h2 id="titulo-fase"></h2>
    <p class="objetivo" id="objetivo"></p>

    <div class="painel-cod">
      <div>
        <div class="rotulo">Programa</div>
        <ol class="codigo" id="codigo"></ol>
      </div>
      <div>
        <div class="rotulo">Saída do programa</div>
        <div class="saida" id="saida"></div>
        <div class="rotulo" style="margin-top:10px">Saída esperada</div>
        <div class="saida" id="esperada" style="background:#eef6f3;color:#23211d"></div>
      </div>
    </div>

    <div id="passo-linha">
      <p class="passo">Passo 1: clique na linha que tem o erro.</p>
    </div>

    <div id="passo-correcao" class="hidden">
      <p class="passo">Passo 2: escolha a linha corrigida. O resultado de cada opção aparece ao lado.</p>
      <div class="opcoes" id="opcoes"></div>
    </div>

    <div class="msg info" id="msg" role="status"></div>

    <div class="toolbar">
      <button class="sec" id="btn-dica">Dica</button>
      <button class="sec" id="btn-recomecar">Recomeçar fase</button>
      <button class="primario" id="btn-proxima" disabled>Próxima fase →</button>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  const CHAVE = "caca-ao-bug-progresso-v1";

  // ---------- Fases ----------
  // Cada fase tem um programa com um erro (linha "bug"), a linha correta e as opções de correção.
  // Linguagem do jogo: "x <- 3", "x <- y", "x <- y + 2", "x <- y - 2", "escreva x", "repita N vezes" ... "fim".
  const NIVEIS = [
    { id: "b1", grupo: "Contar", titulo: "Quantas vezes?",
      objetivo: "O programa deveria escrever 3, porque o passo se repete 3 vezes.",
      dica: "Conte quantas vezes o bloco entre \"repita\" e \"fim\" roda. Quantas vezes o programa precisa repetir?",
      linhas: ["total <- 0", "repita 2 vezes", "total <- total + 1", "fim", "escreva total"],
      bug: 1, correta: "repita 3 vezes",
      opcoes: ["repita 4 vezes", "repita 3 vezes", "repita 1 vezes"] },

    { id: "b2", grupo: "Contar", titulo: "Somando de 2 em 2",
      objetivo: "O programa deveria escrever 8: a soma sobe 2 a cada volta, em 4 voltas.",
      dica: "Leia a linha que muda a soma. Ela soma quanto a cada volta?",
      linhas: ["soma <- 0", "repita 4 vezes", "soma <- soma + 1", "fim", "escreva soma"],
      bug: 2, correta: "soma <- soma + 2",
      opcoes: ["soma <- soma + 2", "soma <- soma - 2", "soma <- 2"] },

    { id: "b3", grupo: "Variáveis", titulo: "Nome errado",
      objetivo: "O programa deveria escrever 8 (5 + 3). Mas a última linha não encontra a variável.",
      dica: "Compare o nome da variável na última linha com o nome que foi criado no começo.",
      linhas: ["pontos <- 5", "pontos <- pontos + 3", "escreva ponto"],
      bug: 2, correta: "escreva pontos",
      opcoes: ["escreva 5", "escreva pontos + 1", "escreva pontos"] },

    { id: "b4", grupo: "Variáveis", titulo: "Vidas no zero",
      objetivo: "As vidas começam em 3 e a cada volta perdem 1. O programa deveria escrever 0.",
      dica: "Perder vida é diminuir. Qual conta faz as vidas diminuírem de 1 em 1?",
      linhas: ["vidas <- 3", "repita 3 vezes", "vidas <- vidas + 1", "fim", "escreva vidas"],
      bug: 2, correta: "vidas <- vidas - 1",
      opcoes: ["vidas <- vidas + 2", "vidas <- vidas - 2", "vidas <- vidas - 1"] },

    { id: "b5", grupo: "Desafio", titulo: "Copiar a variável",
      objetivo: "A variável b deveria receber o valor de a a cada volta, e no fim escrever 3.",
      dica: "Olhe a linha que muda b. Ela está copiando b para ele mesmo, ou copiando de onde?",
      linhas: ["a <- 0", "b <- 0", "repita 3 vezes", "a <- a + 1", "b <- b", "fim", "escreva b"],
      bug: 4, correta: "b <- a",
      opcoes: ["a <- b", "b <- a + 1", "b <- a"] },

    { id: "b6", grupo: "Desafio", titulo: "Escada de 8 degraus",
      objetivo: "Cada volta sobe 2 degraus. O programa deveria escrever 8 degraus.",
      dica: "Quantas voltas precisamos para 2 + 2 + 2 + 2 dar 8?",
      linhas: ["degraus <- 0", "repita 3 vezes", "degraus <- degraus + 2", "fim", "escreva degraus"],
      bug: 1, correta: "repita 4 vezes",
      opcoes: ["repita 2 vezes", "repita 4 vezes", "repita 8 vezes"] }
  ];

  // ---------- Interpretador ----------
  // Retorna { saida: "texto", ok: true|false }. Não lança exceções para o aluno.
  function executar(linhas) {
    const vars = {};
    const saida = [];
    function valor(tok) {
      if (/^-?\d+$/.test(tok)) return parseInt(tok, 10);
      if (Object.prototype.hasOwnProperty.call(vars, tok)) return vars[tok];
      throw new Error("a variável '" + tok + "' não existe");
    }
    function acharFim(k) {
      let profund = 0;
      for (let j = k + 1; j < linhas.length; j++) {
        const L = linhas[j].trim();
        if (/^repita \d+ vezes$/.test(L)) profund++;
        else if (L === "fim") { if (profund === 0) return j; profund--; }
      }
      throw new Error("falta 'fim' para o 'repita' da linha " + (k + 1));
    }
    function bloco(inicio, fimIdx) {
      let k = inicio;
      while (k < fimIdx) {
        const L = linhas[k].trim();
        let m;
        if ((m = L.match(/^repita (\d+) vezes$/))) {
          const fim = acharFim(k);
          for (let r = 0; r < parseInt(m[1], 10); r++) bloco(k + 1, fim);
          k = fim + 1;
          continue;
        }
        if ((m = L.match(/^(\w+) <- (\w+) ([+-]) (-?\d+)$/))) {
          const base = valor(m[2]);
          const n = parseInt(m[4], 10);
          vars[m[1]] = m[3] === "+" ? base + n : base - n;
        } else if ((m = L.match(/^(\w+) <- (\w+)$/))) {
          vars[m[1]] = valor(m[2]);
        } else if ((m = L.match(/^escreva (\w+)$/))) {
          saida.push(String(valor(m[1])));
        } else {
          throw new Error("linha não entendida: \"" + L + "\"");
        }
        k++;
      }
    }
    try {
      bloco(0, linhas.length);
      return { saida: saida.join(" "), ok: true };
    } catch (e) {
      return { saida: "Erro: " + e.message, ok: false };
    }
  }

  // ---------- Estado ----------
  let atual = 0;
  let passo = "linha";   // "linha" | "correcao" | "feito"
  let erros = 0;
  let progresso = carregarProgresso();

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, texto) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (texto != null) e.textContent = texto;
    return e;
  }
  function carregarProgresso() {
    try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { return {}; }
  }
  function salvarProgresso() {
    try { localStorage.setItem(CHAVE, JSON.stringify(progresso)); } catch (e) { /* sem armazenamento */ }
  }
  function nivelAtual() { return NIVEIS[atual]; }
  function linhasComCorrecao(nv, texto) {
    const l = nv.linhas.slice();
    l[nv.bug] = texto;
    return l;
  }
  function esperadoDe(nv) { return executar(linhasComCorrecao(nv, nv.correta)).saida; }

  // ---------- Renderização ----------
  function setMsg(texto, tipo) {
    const m = $("#msg");
    m.textContent = texto;
    m.className = "msg " + (tipo || "info");
  }

  function renderCodigo() {
    const nv = nivelAtual();
    const ol = $("#codigo");
    ol.replaceChildren();
    nv.linhas.forEach((texto, i) => {
      const li = el("li");
      const b = el("button");
      b.type = "button";
      b.append(el("span", "num", (i + 1) + "  "), document.createTextNode(texto));
      b.disabled = passo !== "linha";
      b.onclick = () => clicarLinha(i, li);
      li.append(b);
      if (passo === "feito" && i === nv.bug) li.classList.add("certa");
      ol.append(li);
    });
  }

  function renderSaidas() {
    const nv = nivelAtual();
    $("#saida").textContent = executar(nv.linhas).saida;
    $("#esperada").textContent = esperadoDe(nv);
  }

  function renderOpcoes() {
    const nv = nivelAtual();
    const box = $("#opcoes");
    box.replaceChildren();
    const esperado = esperadoDe(nv);
    nv.opcoes.forEach((texto) => {
      const b = el("button", "opcao");
      b.type = "button";
      const r = executar(linhasComCorrecao(nv, texto));
      b.append(document.createTextNode(texto), el("span", "resultado", "→ saída: " + r.saida));
      b.onclick = () => escolherCorrecao(texto, b, esperado, r.saida);
      box.append(b);
    });
  }

  function clicarLinha(i, li) {
    const nv = nivelAtual();
    if (i === nv.bug) {
      li.classList.add("certa");
      passo = "correcao";
      $("#passo-linha").classList.add("hidden");
      $("#passo-correcao").classList.remove("hidden");
      renderOpcoes();
      setMsg("Isso! Essa é a linha com erro. Agora escolha a correção.", "ok");
    } else {
      erros++;
      li.classList.add("errada");
      setMsg("Essa linha parece certa. Observe a saída do programa e tente de novo.", "erro");
    }
  }

  function escolherCorrecao(texto, botao, esperado, saidaOpcao) {
    const nv = nivelAtual();
    if (texto === nv.correta) {
      botao.classList.add("certa");
      document.querySelectorAll("#opcoes .opcao").forEach((b) => (b.disabled = true));
      passo = "feito";
      const estrelas = erros === 0 ? 3 : erros === 1 ? 2 : 1;
      if (estrelas > (progresso[nv.id] || 0)) { progresso[nv.id] = estrelas; salvarProgresso(); }
      $("#saida").textContent = saidaOpcao;
      setMsg("Corrigido! A saída agora é \"" + saidaOpcao + "\", igual à esperada. " + "★".repeat(estrelas) + "☆".repeat(3 - estrelas), "ok");
      $("#btn-proxima").disabled = atual >= NIVEIS.length - 1;
      renderCodigo();
      atualizarNav();
    } else {
      botao.classList.add("errada");
      setMsg("Essa correção não funciona: a saída seria \"" + saidaOpcao + "\", e a esperada é \"" + esperado + "\".", "erro");
    }
  }

  function atualizarNav() {
    const box = $("#fases");
    box.replaceChildren();
    let grupoAtual = null;
    NIVEIS.forEach((nv, i) => {
      if (nv.grupo !== grupoAtual) { grupoAtual = nv.grupo; box.append(el("div", "grupo", grupoAtual)); }
      const b = el("button", "fase-btn" + (i === atual ? " atual" : ""));
      b.type = "button";
      b.append(el("span", "estrelas", progresso[nv.id] ? "★".repeat(progresso[nv.id]) : ""));
      b.append(document.createTextNode((i + 1) + ". " + nv.titulo));
      b.onclick = () => carregarFase(i);
      box.append(b);
    });
    const feitas = NIVEIS.filter((nv) => progresso[nv.id]).length;
    box.append(el("p", "progresso", "Concluídas: " + feitas + " de " + NIVEIS.length));
  }

  function carregarFase(i) {
    atual = i;
    passo = "linha";
    erros = 0;
    const nv = nivelAtual();
    $("#titulo-fase").textContent = (i + 1) + ". " + nv.titulo;
    $("#objetivo").textContent = nv.objetivo;
    $("#passo-linha").classList.remove("hidden");
    $("#passo-correcao").classList.add("hidden");
    $("#btn-proxima").disabled = true;
    setMsg("Leia o programa e a saída. Qual linha está errada?", "info");
    renderCodigo();
    renderSaidas();
    atualizarNav();
  }

  // ---------- Eventos ----------
  $("#btn-dica").onclick = () => setMsg("Dica: " + nivelAtual().dica, "info");
  $("#btn-recomecar").onclick = () => carregarFase(atual);
  $("#btn-proxima").onclick = () => { if (atual < NIVEIS.length - 1) carregarFase(atual + 1); };

  carregarFase(0);
})();
</script>
</body>
</html>
