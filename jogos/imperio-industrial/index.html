<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Do Zero ao Império Industrial 3D</title>
  <link rel="stylesheet" href="style.css?v=2.3.0">
</head>
<body>
  <div id="palco"></div>
  <div id="rotulos"></div>

  <header class="hud">
    <span id="hud-dinheiro" class="dinheiro"></span>
    <span id="hud-papelao"></span>
    <span id="hud-estoque"></span>
    <span id="hud-produto"></span>
    <span id="hud-produzidas"></span>
    <span id="hud-funcionarios"></span>
    <span id="hud-dia" class="apagado"></span>
    <span id="hud-energia" class="energia oculto"></span>
    <span class="espaco"></span>
    <span class="apagado atalhos">L: loja · Esc: menu</span>
  </header>
  <div class="sub">
    <div id="hud-nivel" class="nivel"></div>
    <div id="hud-missao" class="missao"></div>
  </div>
  <section class="evolucao-hud" aria-label="Evolução da fábrica">
    <small>SUA JORNADA INDUSTRIAL</small>
    <div class="evolucao-titulo"><strong id="fase-nome">Garagem</strong><span id="fase-numero">01 / 06</span></div>
    <div id="fase-etapas" class="fase-etapas"></div>
    <div id="fase-proxima"></div>
    <progress id="fase-progresso" max="1" value="0" aria-label="Dinheiro para a próxima evolução"></progress>
  </section>
  <nav class="acoes-topo" aria-label="Menu do jogo">
    <button data-acao="ativar-audio" id="btn-ativar-audio">♪ Ativar áudio</button>
    <button data-acao="conquistas">🏆 Conquistas</button>
    <button data-acao="gestao">Produção e contratos</button>
    <button data-acao="loja">Loja</button><button data-acao="pausa">Pausar</button>
    <button data-acao="novo" class="reiniciar">Reiniciar do zero</button>
  </nav>
  <section class="guia" aria-label="Orientação da fábrica">
    <small>PRÓXIMO PASSO</small><div id="hud-guia"></div>
    <div id="hud-carga"></div>
    <div id="hud-prestigio"></div>
    <label id="producao-label" for="producao">Montagem na bancada</label>
    <progress id="producao" max="1" value="0"></progress>
  </section>
  <div class="controles-toque" aria-label="Controles de toque">
    <div class="direcional">
      <button class="cima" data-tecla="KeyW" aria-label="Andar para cima">▲</button>
      <button class="esquerda" data-tecla="KeyA" aria-label="Andar para esquerda">◀</button>
      <button class="baixo" data-tecla="KeyS" aria-label="Andar para baixo">▼</button>
      <button class="direita" data-tecla="KeyD" aria-label="Andar para direita">▶</button>
    </div>
    <div class="toque-acoes"><button data-tecla="Interagir">Agir / segurar</button>
    <button data-coletar="true">Retirar caixas</button></div>
  </div>
  <div id="hud-pedido" class="pedido oculto"></div>

  <div id="dica" class="dica oculto"></div>
  <div id="aviso" class="aviso oculto"></div>

  <aside id="loja" class="painel loja oculto">
    <div class="loja-topo"><b>LOJA DA FÁBRICA</b><button data-acao="fechar-loja">Fechar (L)</button></div>
    <div id="lista-loja" class="lista-loja"></div>
  </aside>

  <div id="menu" class="painel menu oculto">
    <b>PAUSADO</b>
    <button data-acao="continuar">Continuar</button>
    <button data-acao="ajuda">Como jogar</button>
    <button data-acao="conquistas">🏆 Conquistas e desafios</button>
    <button data-acao="controles">Controles: teclado / Xbox / outros</button>
    <button data-acao="som" id="btn-som">Áudio geral: ligado</button>
    <button data-acao="musica" id="btn-musica">Música: ligada</button>
    <button data-acao="efeitos" id="btn-efeitos">Efeitos: ligados</button>
    <label class="volume-audio">Volume da música <input id="volume-musica" type="range" min="0" max="100" step="5" value="35" aria-label="Volume da música"></label>
    <label class="volume-audio">Volume dos efeitos <input id="volume-efeitos" type="range" min="0" max="100" step="5" value="70" aria-label="Volume dos efeitos"></label>
    <button data-acao="novo">Reiniciar partida do zero</button>
    <button data-acao="sair">Salvar e sair do jogo</button>
  </div>

  <div id="modal" class="modal oculto">
    <div class="painel janela">
      <h2 id="modal-titulo"></h2>
      <div id="modal-texto"></div>
      <div id="modal-botoes" class="botoes"></div>
    </div>
  </div>

  <div id="conquista-toast" class="conquista-toast oculto" role="status" aria-live="polite"></div>
  <div id="erro3d" class="modal oculto">
    <div class="painel janela">
      <h2>Não foi possível abrir o 3D</h2>
      <p>Este navegador não liberou o WebGL. Tente abrir no Google Chrome, Edge ou Firefox atualizados.</p>
    </div>
  </div>

  <script src="js/three.min.js?v=2.3.0"></script>
  <script src="js/jogo.js?v=2.3.0"></script>
  <script src="js/catalogo.js?v=2.3.0"></script>
  <script src="js/cena.js?v=2.3.0"></script>
  <script src="js/evolucao.js?v=2.3.0"></script>
  <script src="js/personagens.js?v=2.3.0"></script>
  <script src="js/interface.js?v=2.3.0"></script>
  <script src="js/audio.js?v=2.3.0"></script>
  <script src="js/conquistas.js?v=2.3.0"></script>
  <script src="js/controles.js?v=2.3.0"></script>
  <script src="js/principal.js?v=2.3.1"></script>
</body>
</html>
