<!doctype html>
<meta charset="utf-8">
<title>Brasa Eterna 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen arcade cabinet — canvas centered, keycap legend below, touch pad replaces legend on phones */
:root{
  --night:#0e0a14;
  --panel:#1a1222;
  --line:#3a2a48;
  --ash:#c9b8d8;
  --ember:#ff8a3d;
  --gold:#ffd166;
  --display:"Press Start 2P", ui-monospace, monospace;
  --body:"Pixelify Sans", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ash);font-family:var(--body);font-size:15px;
  margin:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  user-select:none;-webkit-user-select:none;overflow-x:hidden;
}
#stage{width:100%;display:flex;justify-content:center}
canvas{
  display:block;outline:none;image-rendering:pixelated;image-rendering:crisp-edges;
  border:2px solid var(--line);border-radius:4px;
  box-shadow:0 0 0 4px var(--panel),0 0 48px rgba(255,138,61,.14);
  touch-action:none;max-width:100%;
}
#below{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:560px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 18px;line-height:1.4}
.legend span{display:inline-flex;align-items:center;gap:6px}
kbd{
  font-family:var(--display);font-size:9px;color:var(--gold);background:var(--panel);
  border:1px solid var(--line);border-bottom-width:3px;border-radius:3px;padding:4px 6px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#mute,#fs{
  font-family:var(--display);font-size:9px;letter-spacing:.04em;background:transparent;
  border:1px solid var(--line);border-radius:3px;padding:6px 8px;color:var(--ash);
}
#mute:hover,#fs:hover{border-color:var(--ember);color:var(--ember)}
.pad{display:none;width:100%;justify-content:space-between;align-items:center;gap:16px;touch-action:none}
#dpad{
  position:relative;width:132px;height:132px;flex:none;border-radius:50%;
  background:radial-gradient(circle,var(--panel) 0 58%,transparent 59%);touch-action:none;
}
#dpad i{position:absolute;background:var(--line);border-radius:4px}
#dpad i.h{left:14px;right:14px;top:50%;height:40px;margin-top:-20px}
#dpad i.v{top:14px;bottom:14px;left:50%;width:40px;margin-left:-20px}
#dpad b{position:absolute;color:var(--ash);font-family:var(--display);font-size:10px}
.btns{display:flex;gap:14px;align-items:flex-end}
.btns button{
  width:68px;height:68px;border-radius:50%;border:2px solid var(--line);background:var(--panel);
  font-family:var(--display);font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;
}
.btns button small{font-family:var(--body);font-size:11px;color:var(--ash)}
.btns .a{color:var(--ember);border-color:var(--ember);margin-bottom:22px}
.btns .b{color:var(--gold)}
.btns .m{width:50px;height:50px;font-size:12px;color:var(--ash);align-self:flex-start}
.btns button.on{background:var(--line)}
.btns .mini{display:grid;grid-template-columns:44px 44px;gap:6px;align-self:flex-start}
.btns .mini .m{width:44px;height:44px;font-size:11px}
:fullscreen .legend{display:none}
:fullscreen body,body:fullscreen{padding-block:4px}
@media (pointer:coarse){
  .pad{display:flex}
  .legend .keys{display:none}
}
@media (prefers-reduced-motion:reduce){canvas{box-shadow:0 0 0 4px var(--panel)}}
</style>

<div id="stage"><canvas id="game" tabindex="0" aria-label="Brasa Eterna 2: Novos Horizontes, jogo de ação em pixel art"></canvas></div>
<div id="below">
  <div class="legend">
    <span class="keys"><kbd>WASD</kbd><kbd>↑↓←→</kbd> mover</span>
    <span class="keys"><kbd>J</kbd><kbd>Espaço</kbd> espada</span>
    <span class="keys"><kbd>K</kbd><kbd>Shift</kbd> esquiva</span>
    <span class="keys"><kbd>I</kbd><kbd>Enter</kbd> equipamentos</span>
    <span class="keys"><kbd>Q</kbd> elemento</span>
    <span class="keys"><kbd>L</kbd> usar item</span>
    <span class="keys"><kbd>R</kbd> trocar item</span>
    <span class="keys"><kbd>O</kbd> objetivo</span>
    <span>Controle: <kbd>A</kbd> espada <kbd>B</kbd> esquiva <kbd>X</kbd> item <kbd>RB</kbd> troca <kbd>Select</kbd> objetivo <kbd>Start</kbd> menu</span>
    <button id="mute" type="button">Som: ligado</button>
    <button id="fs" type="button">Tela cheia (F)</button>
  </div>
  <div class="pad">
    <div id="dpad" aria-label="Direcional"><i class="h"></i><i class="v"></i>
      <b style="left:58px;top:20px">▲</b><b style="left:58px;bottom:20px">▼</b><b style="left:20px;top:60px">◀</b><b style="right:20px;top:60px">▶</b>
    </div>
    <div class="btns">
      <div class="mini">
      <button class="m" type="button" data-act="menu" id="btnM">M<small>menu</small></button>
      <button class="m" type="button" data-act="elem" id="btnE">E<small>elem.</small></button>
      <button class="m" type="button" data-act="tool" id="btnT">R<small>troca</small></button>
      <button class="m" type="button" data-act="use" id="btnU">L<small>item</small></button>
      </div>
      <button class="b" type="button" data-act="dash" id="btnB">B<small>esquiva</small></button>
      <button class="a" type="button" data-act="atk" id="btnA">A<small>espada</small></button>
    </div>
  </div>
</div>

function genWorld(){const C=80,R=60,g=[];srand(777);
  for(let r=0;r<R;r++){const row=[];for(let c=0;c<C;c++)row.push(rnd()<.06?',':'.');g.push(row)}
  const S=(c,r,t)=>{if(c>=0&&c<C&&r>=0&&r<R)g[r][c]=t},G=(c,r)=>(c>=0&&c<C&&r>=0&&r<R)?g[r][c]:'W';
  const blob=(cx,cy,rx,ry,dens)=>{for(let r=cy-ry;r<=cy+ry;r++)for(let c=cx-rx;c<=cx+rx;c++){const d=((c-cx)/rx)**2+((r-cy)/ry)**2;if(d<=1&&rnd()<dens*(1.1-d*.5))S(c,r,'T')}};
  blob(14,11,12,9,.62);blob(66,51,12,7,.6);blob(10,46,8,8,.4);blob(70,8,8,5,.45);
  for(let c=2;c<C-2;c++)for(let r=2;r<5+((c*7)%3);r++)S(c,r,'W');
  for(let c=30;c<=50;c++)for(let r=5;r<=9;r++)if(Math.abs(c-40)>2+((r*3+c)%2))S(c,r,'W');
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=((c-66)/8)**2+((r-26)/5)**2;if(d<=1)S(c,r,'~')}
  for(let r=2;r<21;r++){const c=61+Math.round(Math.sin(r*.5)*1.5);S(c,r,'~');S(c+1,r,'~')}
  for(let r=31;r<R-2;r++){const c=68+Math.round(Math.sin(r*.4)*2);S(c,r,'~');S(c+1,r,'~')}
  for(let r=25;r<=27;r++)for(let c=65;c<=67;c++)S(c,r,'.');
  for(let c=2;c<C-2;c++)S(c,30,G(c,30)==='~'?'B':'=');for(let r=8;r<R-2;r++)S(40,r,G(40,r)==='~'?'B':'=');
  for(let r=8;r<=30;r++)S(12,r,G(12,r)==='~'?'B':'.');for(let c=4;c<=26;c++)if(G(c,13)==='T')S(c,13,'.');
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(c<2||r<2||c>=C-2||r>=R-2)S(c,r,(c+r)%3?'W':'T');
  for(let r=19;r<=41;r++)for(let c=27;c<=53;c++)S(c,r,rnd()<.08?',':'.');
  for(let c=27;c<=53;c++){S(c,19,'f');S(c,41,'f')}for(let r=19;r<=41;r++){S(27,r,'f');S(53,r,'f')}
  for(let c=27;c<=53;c++)S(c,30,'=');for(let r=19;r<=41;r++)S(40,r,'=');

function noise(d,v=.08,fq=1200,dl=0){if(!AC||muted||!OPT.sfx)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*1.5|0,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
  const t=AC.currentTime+dl,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05)}

const gpHeld={};let gpOK=true;
function pollPad(){
  if(!gpOK||!navigator.getGamepads)return;let pads;
  try{pads=navigator.getGamepads()}catch(e){gpOK=false;return}
  const now={};
  for(const g of pads){if(!g)continue;const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);const ax=g.axes[0]||0,ay=g.axes[1]||0;
    if(ax<-.4||b(14))now.left=1;if(ax>.4||b(15))now.right=1;if(ay<-.4||b(12))now.up=1;if(ay>.4||b(13))now.down=1;
    if(b(0))now.atk=1;if(b(2))now.use=1;if(b(5))now.tool=1;if(b(1)||b(6)||b(7))now.dash=1;if(b(3))now.menu=1;if(b(4))now.elem=1;if(b(9))now.start=1;if(b(8))now.obj=1}
  for(const a of['up','down','left','right','atk','dash','start','mute','menu','elem','use','tool','obj']){
    if(now[a]&&!gpHeld[a]){pressed[a]=true;keys[a]=true;audio()}else if(!now[a]&&gpHeld[a])keys[a]=false;
    gpHeld[a]=!!now[a]}
}
