<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receita de bolo — Portal Pixel</title>
<meta name="description" content="Jogo de lógica textual para iniciantes: monte o passo a passo de uma receita de bolo, na ordem certa.">
<style>
  :root { --bg:#f4f1ea; --card:#ffffff; --ink:#23211d; --muted:#6b665c; --acc:#2f7d6d; --acc-2:#e0a526; --erro:#b5382b; --ok:#2e7d4f; --borda:#d8d2c4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 18px; background:var(--card); border-bottom:1px solid var(--borda); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:1.2rem; margin:0; }
  header a { color:var(--acc); text-decoration:none; font-weight:600; }
  .layout { display:grid; grid-template-columns: 230px 1fr; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:14px; }
  aside.fases { display:flex; flex-direction:column; gap:4px; max-height:85vh; overflow:auto; }
  .grupo { font-size:.75rem; color:var(--muted); font-weight:700; text-transform:uppercase; margin:10px 0 2px; }
  .fase-btn { text-align:left; background:#fff; border:1px solid var(--borda); border-radius:8px; padding:7px 9px; cursor:pointer; font:inherit; color:var(--ink); }
  .fase-btn.atual { border-color:var(--acc); background:#eef6f3; }
  .fase-btn .estrelas { float:right; color:var(--acc-2); letter-spacing:1px; }
  .progresso { font-size:.85rem; color:var(--muted); margin-top:8px; }
  h2 { margin:0 0 4px; font-size:1.2rem; }
  .objetivo { margin:0 0 10px; color:var(--muted); }
  .colunas { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width:820px) { .colunas { grid-template-columns:1fr; } }
  .rotulo { font-size:.75rem; color:var(--muted); font-weight:700; text-transform:uppercase; margin-bottom:6px; }
  ol.roteiro { list-style:none; margin:0; padding:0; }
  ol.roteiro li { display:flex; align-items:center; gap:6px; background:#fbfaf6; border:1px solid var(--borda); border-radius:8px; padding:7px 8px; margin:6px 0; }
  ol.roteiro li .num { width:24px; color:var(--muted); font-weight:700; }
  ol.roteiro li .txt { flex:1; }
  ol.roteiro li.ativo { outline:3px solid var(--acc-2); }
  ol.roteiro li.falhou { outline:3px solid var(--erro); }
  ol.roteiro li.vazio { color:var(--muted); font-style:italic; justify-content:center; }
  .mini { background:#fff; border:1px solid var(--borda); border-radius:6px; padding:2px 7px; font-size:.85rem; cursor:pointer; font:inherit; }
  .paleta { display:flex; flex-direction:column; gap:6px; }
  .paleta button { text-align:left; background:#eef6f3; border:1px solid var(--acc); color:var(--ink); border-radius:8px; padding:7px 10px; cursor:pointer; font:inherit; }
  .paleta button:hover { background:#dff0ea; }
  .estado { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { font-size:.8rem; padding:3px 8px; border-radius:999px; border:1px solid var(--borda); background:#fff; color:var(--muted); }
  .chip.on { background:#e4f5ea; border-color:var(--ok); color:var(--ok); font-weight:700; }
  .msg { padding:10px; border-radius:8px; min-height:44px; font-size:.95rem; margin-top:12px; }
  .msg.ok { background:#e4f5ea; color:var(--ok); }
  .msg.erro { background:#fbe7e4; color:var(--erro); }
  .msg.info { background:#fdf3d8; color:#6a4b00; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  button { font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .primario { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-weight:700; }
  .sec { background:#fff; color:var(--ink); border:1px solid var(--borda); border-radius:8px; padding:8px 12px; }
  .rodando .colunas { pointer-events:none; opacity:.75; }
</style>
</head>
<body>
<header>
  <h1>Receita de bolo</h1>
  <a href="../../index.html">← Portal Pixel</a>
</header>

<div class="layout">
  <aside class="card fases" id="fases" aria-label="Fases"></aside>

  <main class="card">
    <h2 id="titulo-fase"></h2>
    <p class="objetivo" id="objetivo"></p>

    <div class="colunas">
      <div>
        <div class="rotulo">Seu roteiro (executa de cima para baixo)</div>
        <ol class="roteiro" id="roteiro"></ol>
        <div class="rotulo" style="margin-top:10px">Adicionar passo</div>
        <div class="paleta" id="paleta"></div>
      </div>
      <div>
        <div class="rotulo">Na cozinha agora</div>
        <div class="estado" id="estado"></div>
        <p class="objetivo" id="falta" style="margin-top:12px"></p>
        <div class="toolbar">
          <button class="primario" id="btn-executar">▶ Executar roteiro</button>
          <button class="sec" id="btn-limpar">Limpar roteiro</button>
          <button class="sec" id="btn-dica">Dica</button>
          <button class="sec" id="btn-solucao">Ver solução</button>
          <button class="sec" id="btn-proxima" disabled>Próxima fase →</button>
        </div>
      </div>
    </div>

    <div class="msg info" id="msg" role="status"></div>
    <p class="objetivo" id="contador" style="margin-top:10px"></p>
  </main>
</div>

<script>
(function () {
  "use strict";

  const CHAVE = "receita-de-bolo-progresso-v1";

  // ---------- Passos da receita ----------
  // exige: lista de [estado necessário, mensagem se faltar].
  // efeito: o que muda na cozinha depois do passo.
  const PASSOS = {
    ovos:      { texto: "Quebrar os ovos numa tigela", exige: [], efeito: { ovos: true } },
    acucar:    { texto: "Colocar o açúcar na tigela", exige: [], efeito: { acucar: true } },
    bater:     { texto: "Bater os ovos com o açúcar", exige: [["ovos", "Quebre os ovos antes de bater."], ["acucar", "Coloque o açúcar antes de bater."]], efeito: { batido: true } },
    leite:     { texto: "Acrescentar o leite", exige: [["batido", "Bata os ovos com o açúcar antes do leite."]], efeito: { leite: true } },
    farinha:   { texto: "Colocar a farinha numa tigela à parte", exige: [], efeito: { farinha: true } },
    fermento:  { texto: "Colocar o fermento na farinha", exige: [["farinha", "Coloque a farinha antes do fermento."]], efeito: { fermento: true } },
    juntar:    { texto: "Juntar a farinha com a mistura dos ovos", exige: [["batido", "Bata os ovos antes de juntar."], ["leite", "Acrescente o leite antes de juntar."], ["fermento", "Falta o fermento na farinha."]], efeito: { massa: true } },
    forma:     { texto: "Untar a forma", exige: [], efeito: { forma: true } },
    forno:     { texto: "Ligar o forno para aquecer", exige: [], efeito: { forno: true } },
    despejar:  { texto: "Despejar a massa na forma", exige: [["massa", "A massa ainda não está pronta."], ["forma", "Unte a forma antes de despejar a massa."]], efeito: { despejado: true } },
    assar:     { texto: "Assar por 30 minutos", exige: [["forno", "O forno ainda não foi ligado."], ["despejado", "A massa ainda não está na forma."]], efeito: { assado: true } },
    esfriar:   { texto: "Deixar o bolo esfriar", exige: [["assado", "O bolo ainda não foi assado."]], efeito: { frio: true } },
    tv:        { texto: "Ligar a TV da sala", exige: [], efeito: {} }
  };
  const FALTA_NOME = { massa: "massa pronta", despejado: "massa na forma", assado: "bolo assado", frio: "bolo frio" };

  // ---------- Fases ----------
  const NIVEIS = [
    { id: "r1", grupo: "A massa", titulo: "Massa pronta",
      objetivo: "Monte o roteiro para deixar a massa pronta. Os ovos precisam ser batidos antes de receber o leite.",
      dica: "Comece pelos ovos e pelo açúcar. Depois de bater, acrescente o leite. A farinha e o fermento vêm juntos antes de misturar tudo.",
      permitidos: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar"], goal: { massa: true }, ideal: 7,
      inicial: ["juntar", "bater", "fermento", "ovos", "leite", "acucar", "farinha"],
      solucao: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar"] },

    { id: "r2", grupo: "Forno e forma", titulo: "Massa na forma",
      objetivo: "Agora a massa precisa estar dentro da forma. A forma precisa estar untada antes.",
      dica: "Pense no que precisa existir antes de despejar: massa pronta e forma untada.",
      permitidos: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar", "forma", "forno", "despejar"], goal: { despejado: true }, ideal: 10,
      inicial: ["despejar", "forno", "juntar", "bater", "ovos", "forma", "acucar", "leite", "farinha", "fermento"],
      solucao: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar", "forma", "forno", "despejar"] },

    { id: "r3", grupo: "Forno e forma", titulo: "Bolo assado",
      objetivo: "Asse o bolo. O forno precisa estar ligado e a massa precisa estar na forma antes de ir ao forno.",
      dica: "O forno é ligado antes de assar, e a massa só vai ao forno depois de estar na forma.",
      permitidos: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar", "forma", "forno", "despejar", "assar"], goal: { assado: true }, ideal: 11,
      inicial: ["assar", "despejar", "forno", "forma", "juntar", "bater", "leite", "ovos", "acucar", "farinha", "fermento"],
      solucao: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar", "forma", "forno", "despejar", "assar"] },

    { id: "r4", grupo: "Desafio", titulo: "Só o que a receita pede",
      objetivo: "O bolo precisa esfriar antes de ser servido. Tem um passo que não faz parte da receita. Deixe-o de fora.",
      dica: "Pergunte, para cada passo: ele ajuda a fazer o bolo?",
      permitidos: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar", "forma", "forno", "despejar", "assar", "esfriar", "tv"], goal: { frio: true }, ideal: 12,
      inicial: ["tv", "esfriar", "assar", "despejar", "forno", "forma", "juntar", "fermento", "farinha", "leite", "bater", "acucar", "ovos"],
      solucao: ["ovos", "acucar", "bater", "leite", "farinha", "fermento", "juntar", "forma", "forno", "despejar", "assar", "esfriar"] }
  ];

  // ---------- Estado ----------
  const ESTADO_INICIAL = { ovos: false, acucar: false, batido: false, leite: false, farinha: false, fermento: false, massa: false, forma: false, forno: false, despejado: false, assado: false, frio: false };
  const NOMES_ESTADO = [
    ["ovos", "ovos"], ["acucar", "açúcar"], ["batido", "ovos batidos"], ["leite", "leite"], ["farinha", "farinha"],
    ["fermento", "fermento"], ["massa", "massa pronta"], ["forma", "forma untada"], ["forno", "forno ligado"],
    ["despejado", "massa na forma"], ["assado", "bolo assado"], ["frio", "bolo frio"]
  ];

  let atual = 0;
  let roteiro = [];
  let animando = false;
  let progresso = carregarProgresso();

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, texto) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (texto != null) e.textContent = texto;
    return e;
  }
  function carregarProgresso() {
    try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch (e) { return {}; }
  }
  function salvarProgresso() {
    try { localStorage.setItem(CHAVE, JSON.stringify(progresso)); } catch (e) { /* sem armazenamento */ }
  }
  function nivelAtual() { return NIVEIS[atual]; }

  // ---------- Simulação ----------
  function simular(lista) {
    const estado = Object.assign({}, ESTADO_INICIAL);
    const quadros = [{ indice: -1, estado: Object.assign({}, estado), erro: null }];
    for (let i = 0; i < lista.length; i++) {
      const passo = PASSOS[lista[i]];
      const falta = passo.exige.find(([chave]) => !estado[chave]);
      if (falta) {
        quadros.push({ indice: i, estado: Object.assign({}, estado), erro: falta[1] });
        return { quadros, final: estado, erro: falta[1], indiceErro: i };
      }
      Object.assign(estado, passo.efeito);
      quadros.push({ indice: i, estado: Object.assign({}, estado), erro: null });
    }
    return { quadros, final: estado, erro: null, indiceErro: -1 };
  }

  function faltaParaObjetivo(estado, goal) {
    return Object.keys(goal).filter((k) => !!estado[k] !== !!goal[k]).map((k) => FALTA_NOME[k] || k);
  }

  // ---------- Renderização ----------
  function setMsg(texto, tipo) {
    const m = $("#msg");
    m.textContent = texto;
    m.className = "msg " + (tipo || "info");
  }

  function renderRoteiro() {
    const box = $("#roteiro");
    box.replaceChildren();
    if (!roteiro.length) box.append(el("li", "vazio", "Monte o roteiro adicionando passos abaixo."));
    roteiro.forEach((chave, i) => {
      const li = el("li");
      li.dataset.i = i;
      li.append(el("span", "num", (i + 1) + "."), el("span", "txt", PASSOS[chave].texto));
      const bot = (rotulo, fn, titulo) => { const b = el("button", "mini", rotulo); b.type = "button"; b.title = titulo; b.onclick = fn; return b; };
      li.append(
        bot("↑", () => { if (i > 0) { [roteiro[i - 1], roteiro[i]] = [roteiro[i], roteiro[i - 1]]; atualizar(); } }, "Subir"),
        bot("↓", () => { if (i < roteiro.length - 1) { [roteiro[i + 1], roteiro[i]] = [roteiro[i], roteiro[i + 1]]; atualizar(); } }, "Descer"),
        bot("✕", () => { roteiro.splice(i, 1); atualizar(); }, "Remover")
      );
      box.append(li);
    });
  }

  function renderPaleta() {
    const box = $("#paleta");
    box.replaceChildren();
    nivelAtual().permitidos.forEach((chave) => {
      const b = el("button", null, "+ " + PASSOS[chave].texto);
      b.type = "button";
      b.onclick = () => { roteiro.push(chave); atualizar(); };
      box.append(b);
    });
  }

  function renderEstado(estado) {
    const box = $("#estado");
    box.replaceChildren();
    NOMES_ESTADO.forEach(([k, nome]) => {
      box.append(el("span", "chip" + (estado[k] ? " on" : ""), (estado[k] ? "✔ " : "") + nome));
    });
  }

  function renderFalta(estado) {
    const falta = faltaParaObjetivo(estado, nivelAtual().goal);
    $("#falta").textContent = falta.length ? "Ainda falta: " + falta.join(", ") + "." : "";
  }

  function atualizarContador() {
    $("#contador").textContent = "Passos no roteiro: " + roteiro.length + " (ideal: " + nivelAtual().ideal + ")";
  }

  function atualizarNav() {
    const box = $("#fases");
    box.replaceChildren();
    let grupoAtual = null;
    NIVEIS.forEach((nv, i) => {
      if (nv.grupo !== grupoAtual) { grupoAtual = nv.grupo; box.append(el("div", "grupo", grupoAtual)); }
      const b = el("button", "fase-btn" + (i === atual ? " atual" : ""));
      b.type = "button";
      b.append(el("span", "estrelas", progresso[nv.id] ? "★".repeat(progresso[nv.id]) : ""));
      b.append(document.createTextNode((i + 1) + ". " + nv.titulo));
      b.onclick = () => carregarFase(i);
      box.append(b);
    });
    const feitas = NIVEIS.filter((nv) => progresso[nv.id]).length;
    box.append(el("p", "progresso", "Concluídas: " + feitas + " de " + NIVEIS.length));
  }

  function atualizar() {
    if (animando) return;
    renderRoteiro();
    renderPaleta();
    renderEstado(ESTADO_INICIAL);
    renderFalta(ESTADO_INICIAL);
    atualizarContador();
    setMsg("", "info");
  }

  function carregarFase(i) {
    atual = i;
    animando = false;
    document.body.classList.remove("rodando");
    const nv = nivelAtual();
    $("#titulo-fase").textContent = (i + 1) + ". " + nv.titulo;
    $("#objetivo").textContent = nv.objetivo;
    roteiro = nv.inicial.slice();
    setMsg("Coloque os passos na ordem certa e execute o roteiro.", "info");
    renderRoteiro();
    renderPaleta();
    renderEstado(ESTADO_INICIAL);
    renderFalta(ESTADO_INICIAL);
    atualizarContador();
    atualizarNav();
    setBotoes();
  }

  function setBotoes() {
    $("#btn-executar").disabled = animando;
    $("#btn-proxima").disabled = animando || !progresso[nivelAtual().id] || atual >= NIVEIS.length - 1;
  }

  function destacar(indice, falhou) {
    document.querySelectorAll("#roteiro li.ativo, #roteiro li.falhou").forEach((li) => li.classList.remove("ativo", "falhou"));
    if (indice < 0) return;
    const li = document.querySelector('#roteiro li[data-i="' + indice + '"]');
    if (li) li.classList.add(falhou ? "falhou" : "ativo");
  }

  function executarRoteiro() {
    if (animando) return;
    if (!roteiro.length) { setMsg("Adicione passos ao roteiro antes de executar.", "erro"); return; }
    const nv = nivelAtual();
    const r = simular(roteiro);
    animando = true;
    document.body.classList.add("rodando");
    setBotoes();
    setMsg("Executando…", "info");
    let i = 0;
    const passo = () => {
      const q = r.quadros[i];
      renderEstado(q.estado);
      renderFalta(q.estado);
      destacar(q.indice, !!q.erro);
      i++;
      if (i < r.quadros.length) {
        setTimeout(passo, 650);
      } else {
        animando = false;
        document.body.classList.remove("rodando");
        concluir(r, nv);
      }
    };
    passo();
  }

  function concluir(r, nv) {
    if (r.erro) {
      setMsg("Passo " + (r.indiceErro + 1) + " não pôde acontecer: " + r.erro, "erro");
    } else {
      const falta = faltaParaObjetivo(r.final, nv.goal);
      if (falta.length) {
        setMsg("O roteiro terminou, mas o bolo não ficou pronto. Falta: " + falta.join(", ") + ".", "erro");
      } else {
        const n = roteiro.length;
        const st = n <= nv.ideal ? 3 : n <= nv.ideal + 2 ? 2 : 1;
        if (st > (progresso[nv.id] || 0)) { progresso[nv.id] = st; salvarProgresso(); }
        setMsg("Bolo pronto! " + "★".repeat(st) + "☆".repeat(3 - st) + " — " + n + " passos (ideal: " + nv.ideal + ").", "ok");
      }
    }
    atualizarNav();
    setBotoes();
  }

  // ---------- Eventos ----------
  $("#btn-executar").onclick = executarRoteiro;
  $("#btn-limpar").onclick = () => { roteiro = []; atualizar(); };
  $("#btn-dica").onclick = () => setMsg("Dica: " + nivelAtual().dica, "info");
  $("#btn-solucao").onclick = () => {
    roteiro = nivelAtual().solucao.slice();
    atualizar();
    setMsg("Solução carregada. Clique em Executar para ver o bolo ficar pronto.", "info");
  };
  $("#btn-proxima").onclick = () => { if (atual < NIVEIS.length - 1) carregarFase(atual + 1); };

  carregarFase(0);
})();
</script>
</body>
</html>
